[package]
name = "bb-auction"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bb-auction"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["gzip", "tls-webpki-roots"] }
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["time", "bundled"] }
rand = "0.10"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
bip0039 = { version = "0.14", features = ["std"] }
secrecy = "0.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
clap = { version = "4.5", features = ["derive", "env"] }
nonempty = { version = "0.11", default-features = false }

# Zcash
orchard = { version = "0.16", default-features = false, features = ["unstable-frost"] }
sapling = { package = "sapling-crypto", version = "0.9" }
zcash_address = "=0.14.0-pre.1"
zcash_client_backend = { version = "=0.25.0-pre.1", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "sync", "transparent-inputs", "pczt"] }
zcash_client_sqlite = { version = "=0.23.0-pre.1", features = ["orchard", "transparent-inputs", "serde"] }
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard", "sapling", "unstable-frost"] }
zcash_primitives = "=0.31.0-pre.1"
pczt = { version = "=0.10.0-pre.1", features = ["orchard", "prover", "signer", "io-finalizer", "spend-finalizer", "tx-extractor"] }
bb-frost = { path = "../../packages/bb-frost" }
ff = "0.14"
zcash_proofs = { version = "=0.31.0-pre.1", features = ["bundled-prover", "multicore"] }
transparent = { package = "zcash_transparent", version = "=0.11.0-pre.1", features = ["transparent-inputs"] }
zcash_note_encryption = "0.5"
chacha20poly1305 = "0.10"
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }
zip32 = "0.3"
zip321 = "=0.10.0-pre.1"
