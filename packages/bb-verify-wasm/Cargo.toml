[package]
name = "bb-verify-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
hex = "0.4"
orchard = { version = "0.16", default-features = false }
chacha20poly1305 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
bip0039 = { version = "0.14", default-features = false }
zcash_address = "=0.14.0-pre.1"
zip32 = "0.3"
zcash_protocol = { version = "=0.11.0-pre.0", default-features = false }
serde_json = "1"

[dev-dependencies]
# Native-only cross-check that the browser derivation matches the service's (zcash_keys does not build for wasm).
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard", "transparent-inputs"] }
zcash_protocol = { version = "=0.11.0-pre.0" }

[profile.release]
opt-level = "s"
